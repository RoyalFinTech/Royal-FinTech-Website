name: Royal FinTech Frontend Smoke Test

on:
  push:
    paths:
      - "royal_fintech_website.html"
      - "tests/smoke-test.mjs"
      - "tests/browser-smoke.mjs"
      - ".github/workflows/frontend-smoke-test.yml"
  pull_request:
    paths:
      - "royal_fintech_website.html"
      - "tests/smoke-test.mjs"
      - "tests/browser-smoke.mjs"
      - ".github/workflows/frontend-smoke-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    name: Validate primary HTML and navigation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run source-level smoke test
        run: node tests/smoke-test.mjs
      - name: Prepare temporary npm project
        run: npm init -y
      - name: Install pinned Playwright test dependency
        run: npm install --no-save playwright@1.55.0
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Chromium responsive browser smoke test
        run: node tests/browser-smoke.mjs
